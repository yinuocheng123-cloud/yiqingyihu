version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: yiqingyihu-opc-postgres
    environment:
      POSTGRES_DB: yiqingyihu_opc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev:server"
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  web:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev:web -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
